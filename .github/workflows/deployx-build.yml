name: DeployX Build

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Target GitHub repository owner"
        required: true
        type: string

      repo:
        description: "Target GitHub repository name"
        required: true
        type: string

      branch:
        description: "Target GitHub branch"
        required: true
        type: string

      root_directory:
        description: "Application root directory"
        required: false
        type: string
        default: ""

      deployment_id:
        description: "DeployX MongoDB deployment ID"
        required: true
        type: string

      output_directory:
        description: "Build output directory"
        required: true
        type: string
        default: "dist"

      project_slug:
        description: "DeployX project slug"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEPLOYX_API_URL: ${{ secrets.DEPLOYX_API_URL }}
      DEPLOYX_DEPLOYMENT_SECRET: ${{ secrets.DEPLOYX_DEPLOYMENT_SECRET }}
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      OUTPUT_DIRECTORY: ${{ inputs.output_directory }}
      PROJECT_SLUG: ${{ inputs.project_slug }}

    steps:

      # ========================================
      # 1. Create GitHub App token
      # ========================================

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DEPLOYX_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOYX_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repo }}

      # ========================================
      # 2. Create DeployX progress reporter
      # ========================================

      - name: Create DeployX progress reporter
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/report-deployx.sh" <<'SCRIPT'
          #!/usr/bin/env bash

          STATUS="$1"
          CURRENT_STEP="$2"
          MESSAGE="$3"
          DEPLOYMENT_URL="${4:-}"

          export STATUS
          export CURRENT_STEP
          export MESSAGE
          export DEPLOYMENT_URL

          python - <<'PY' > "$RUNNER_TEMP/deployx-payload.json"
          import json
          import os

          payload = {
              "deploymentId": os.environ["DEPLOYMENT_ID"],
              "status": os.environ["STATUS"],
              "currentStep": os.environ["CURRENT_STEP"],
              "logs": os.environ["MESSAGE"] + "\n"
          }

          if os.environ.get("DEPLOYMENT_URL"):
              payload["url"] = os.environ["DEPLOYMENT_URL"]

          if os.environ.get("OUTPUT_DIRECTORY"):
              payload["outputDirectory"] = os.environ["OUTPUT_DIRECTORY"]

          print(json.dumps(payload))
          PY

          echo ""
          echo "DeployX progress:"
          echo "$MESSAGE"

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-DeployX-Secret: $DEPLOYX_DEPLOYMENT_SECRET" \
            --data-binary "@$RUNNER_TEMP/deployx-payload.json" \
            "${DEPLOYX_API_URL}/api/webhooks/deployment" \
            || echo "WARNING: DeployX progress update failed."

          SCRIPT

          chmod +x "$RUNNER_TEMP/report-deployx.sh"

      # ========================================
      # 3. Checkout target repository
      # ========================================

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ steps.app-token.outputs.token }}

      # ========================================
      # 4. Report checkout complete
      # ========================================

      - name: Report checkout complete
        shell: bash
        run: |
          "$RUNNER_TEMP/report-deployx.sh" \
            "building" \
            "Repository Ready" \
            "Repository ${{ inputs.owner }}/${{ inputs.repo }} checked out successfully.
            \nBranch: ${{ inputs.branch }}"

      # ========================================
      # 5. Setup Node
      # ========================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ========================================
      # 6. Show deployment information
      # ========================================

      - name: Show deployment information
        run: |
          echo "========================================"
          echo "DeployX Deployment"
          echo "========================================"
          echo "Repository: ${{ inputs.owner }}/${{ inputs.repo }}"
          echo "Branch: ${{ inputs.branch }}"
          echo "Root directory: '${{ inputs.root_directory }}'"
          echo "Deployment ID: ${{ inputs.deployment_id }}"
          echo "Output directory: ${{ inputs.output_directory }}"
          echo "Project slug: ${{ inputs.project_slug }}"
          echo "========================================"
          echo ""
          echo "Node:"
          node --version
          echo ""
          echo "NPM:"
          npm --version
          echo ""
          echo "Current directory:"
          pwd
          echo ""
          echo "Repository contents:"
          ls -la

      # ========================================
      # 7. Installing dependencies - START
      # ========================================

      - name: Report dependency installation started
        shell: bash
        run: |
          "$RUNNER_TEMP/report-deployx.sh" \
            "building" \
            "Installing Dependencies" \
            "Installing project dependencies..."

      # ========================================
      # 8. Install dependencies
      # ========================================

      - name: Install dependencies
        working-directory: ${{ inputs.root_directory }}
        shell: bash
        run: |
          echo "Installing dependencies..."

          if [ -f package-lock.json ]; then
            echo "package-lock.json found."
            echo "Running npm ci..."
            npm ci --no-audit --no-fund
          else
            echo "No package-lock.json found."
            echo "Running npm install..."
            npm install --no-audit --no-fund
          fi

      # ========================================
      # 9. Installing dependencies - COMPLETE
      # ========================================

      - name: Report dependency installation complete
        shell: bash
        run: |
          "$RUNNER_TEMP/report-deployx.sh" \
            "building" \
            "Dependencies Installed" \
            "Project dependencies installed successfully."

      # ========================================
      # 10. Build - START
      # ========================================

      - name: Report build started
        shell: bash
        run: |
          "$RUNNER_TEMP/report-deployx.sh" \
            "building" \
            "Building Project" \
            "Starting application build with npm run build..."

      # ========================================
      # 11. Build project
      # ========================================

      - name: Build project
        working-directory: ${{ inputs.root_directory }}
        shell: bash
        run: |
          echo "Running application build..."
          npm run build

          echo ""
          echo "Build completed."
          echo ""
          echo "Build output:"
          ls -la "${{ inputs.output_directory }}"

      # ========================================
      # 12. Build - COMPLETE
      # ========================================

      - name: Report build complete
        shell: bash
        run: |
          "$RUNNER_TEMP/report-deployx.sh" \
            "building" \
            "Build Complete" \
            "Application built successfully.
            \nOutput directory: ${{ inputs.output_directory }}"

      # ========================================
      # 13. Install Vercel CLI
      # ========================================

      - name: Install Vercel CLI
        run: |
          echo "Installing Vercel CLI..."
          npm install --global vercel@latest

          echo ""
          echo "Vercel version:"
          vercel --version

      # ========================================
      # 14. Report Vercel preparation
      # ========================================

      - name: Report Vercel preparation
        shell: bash
        run: |
          "$RUNNER_TEMP/report-deployx.sh" \
            "building" \
            "Preparing Deployment" \
            "Vercel CLI is ready. Preparing production deployment..."

      # ========================================
      # 15. Deploy to Vercel
      # ========================================

      - name: Deploy to Vercel
        id: vercel-deploy
        working-directory: ${{ inputs.root_directory }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -e

          OUTPUT_DIR="${{ inputs.output_directory }}"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "Build output directory '$OUTPUT_DIR' does not exist."
            exit 1
          fi

          echo "Deploying '$OUTPUT_DIR' to Vercel..."

          mkdir -p ../deployx-vercel-upload

          rm -rf ../deployx-vercel-upload/*

          cp -R "$OUTPUT_DIR"/. ../deployx-vercel-upload/

          cd ../deployx-vercel-upload

          echo "Files being deployed:"
          ls -la

          echo ""
          echo "Starting Vercel deployment..."

          url=$(
            vercel deploy \
              --prod \
              --yes \
              --token="$VERCEL_TOKEN"
          )

          url="$(echo "$url" | tail -n 1 | tr -d '\r')"

          if [ -z "$url" ]; then
            echo "Vercel did not return a deployment URL."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Vercel Deployment URL:"
          echo "$url"
          echo "========================================"

          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      # ========================================
      # 16. Report Vercel deployment complete
      # ========================================

      - name: Report Vercel deployment complete
        if: success()
        shell: bash
        run: |
          "$RUNNER_TEMP/report-deployx.sh" \
            "success" \
            "Deployment Complete" \
            "GitHub Actions build and Vercel deployment completed successfully.
            \nDeployment URL: ${{ steps.vercel-deploy.outputs.deployment_url }}" \
            "${{ steps.vercel-deploy.outputs.deployment_url }}"

      # ========================================
      # 17. Report failure
      # ========================================

      - name: Report deployment failure
        if: failure()
        shell: bash
        run: |
          "$RUNNER_TEMP/report-deployx.sh" \
            "failed" \
            "Failed" \
            "Deployment failed. Check the GitHub Actions logs for the failed step."